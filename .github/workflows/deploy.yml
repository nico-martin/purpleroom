name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an FTP upload or deploy two versions concurrently.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy via FTP
    # Keep image upgrades deliberate rather than following ubuntu-latest rollouts.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: VITE_APP_VERSION="$(git rev-parse --short=7 HEAD)" pnpm build

      - name: Prepare and verify deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/green-room-deploy"
          mkdir -p "$bundle/api"
          rsync -a dist/ "$bundle/"
          rsync -a \
            --exclude='config.local.php' \
            --exclude='db/db.sqlite*' \
            --exclude='db/sessions/' \
            --exclude='db/logos/' \
            --exclude='db/avatars/' \
            --exclude='db/invite-links/' \
            --exclude='dev-router.php' \
            api/ "$bundle/api/"

          test -s "$bundle/index.html"
          test -d "$bundle/assets"
          test -s "$bundle/.htaccess"
          test -s "$bundle/api/index.php"
          test -s "$bundle/api/.htaccess"
          test -s "$bundle/api/db/.htaccess"
          test -s "$bundle/api/db/schema.sql"
          test -s "$bundle/api/db/migrations/002_edition_titles.sql"
          test -s "$bundle/api/db/migrations/004_profile_links.sql"
          test -s "$bundle/api/db/migrations/005_unassigned_submissions.sql"
          test -s "$bundle/api/db/migrations/006_submission_notes.sql"
          test -s "$bundle/api/db/migrations/007_conference_tags.sql"
          test -s "$bundle/api/db/migrations/008_login_codes.sql"
          test -s "$bundle/api/db/migrations/009_account_deletion.sql"
          test -s "$bundle/api/db/migrations/010_date_timezones.sql"
          test ! -e "$bundle/api/config.local.php"
          test ! -e "$bundle/api/db/db.sqlite"
          test ! -d "$bundle/api/db/sessions"
          test ! -d "$bundle/api/db/logos"
          test ! -d "$bundle/api/db/avatars"
          test ! -d "$bundle/api/db/invite-links"
          echo "Frontend assets, PHP backend, and Apache protection files are ready."

      - name: Generate production PHP config
        shell: bash
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM }}
          APP_SETUP_KEY: ${{ secrets.APP_SETUP_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}
        run: |
          set -euo pipefail
          node scripts/generate-production-config.mjs "$RUNNER_TEMP/green-room-deploy/api/config.local.php"
          test -s "$RUNNER_TEMP/green-room-deploy/api/config.local.php"

      - name: Validate FTP configuration
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DEPLOY_PATH: ${{ secrets.FTP_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Set the FTP_SERVER repository secret}"
          : "${FTP_USERNAME:?Set the FTP_USERNAME repository secret}"
          : "${FTP_PASSWORD:?Set the FTP_PASSWORD repository secret}"
          : "${FTP_DEPLOY_PATH:?Set the FTP_DEPLOY_PATH repository secret}"
          if [[ "$FTP_DEPLOY_PATH" != */ ]]; then
            echo "::error::FTP_DEPLOY_PATH must end with a slash."
            exit 1
          fi

      - name: Deploy frontend and PHP backend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DEPLOY_PATH }}
          local-dir: ${{ runner.temp }}/green-room-deploy/
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          security: strict
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            api/db/db.sqlite*
            api/db/sessions
            api/db/sessions/**
            api/db/logos
            api/db/logos/**
            api/db/avatars
            api/db/avatars/**
            api/db/invite-links
            api/db/invite-links/**
            api/dev-router.php

      - name: Remove generated config from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/green-room-deploy/api/config.local.php"

      - name: Deployment complete
        run: |
          echo "### Production files deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend bundles, PHP backend, and generated production config uploaded. Live database, sessions, stored logos/avatars, and encrypted invite-link storage were excluded." >> "$GITHUB_STEP_SUMMARY"
          echo 'First deployment: set APP_SETUP_KEY and visit /setup to initialize the database and first user. Delete APP_SETUP_KEY and redeploy after setup. Existing installations apply bundled database migrations automatically on the next API request.' >> "$GITHUB_STEP_SUMMARY"
